<!DOCTYPE html>
<html lang="en">
    <!-- Header bar that contains the settings -->
    <div class="login-panel">
        <div class="text-field-container">
            <label for="in_username">Username</label>
            <input class="text-field" type="text" id="in_username" required> </input>
        </div>

        <div class="text-field-container">
            <label for="in_password">Password</label>
            <input class="text-field" type="text" id="in_password" required> </input>
        </div>

        <button class="login-submit-button" id="submit-login-button"> Submit </button>
    </div>
</html>
