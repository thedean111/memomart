<!DOCTYPE html>
<html lang="en">
    <div class="login-panel">
        <div class="text-field-container">
            <label for="wifi_ssid">SSID</label>
            <input class="text-field" type="text" id="wifi_ssid" required> </input>
        </div>

        <div class="text-field-container">
            <label for="wifi_password">Password</label>
            <input class="text-field" type="text" id="wifi_password" required> </input>
        </div>

        <button class="login-submit-button" id="connect-wifi-button"> Connect </button>
        <button class="login-submit-button wifi-disconnect-button" id="disconnect-wifi-button"> Disconnect </button>
    </div>
</html>
